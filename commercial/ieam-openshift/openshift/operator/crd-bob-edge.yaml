apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bobedgedeployments.automation.bob-edge.io
spec:
  group: automation.bob-edge.io
  names:
    kind: BobEdgeDeployment
    listKind: BobEdgeDeploymentList
    plural: bobedgedeployments
    singular: bobedgedeployment
    shortNames:
      - bobedge
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                environment:
                  type: string
                  enum: ["dev", "staging", "production"]
                  default: "production"
                stormModeEnabled:
                  type: boolean
                  default: true
                offlineAutonomyDays:
                  type: integer
                  default: 30
                maxCircuitSheddingPercent:
                  type: integer
                  minimum: 10
                  maximum: 90
                  default: 75
                policies:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                readyNodes:
                  type: integer
                gridStatus:
                  type: string
                currentPowerDrawWatts:
                  type: number
                auditChainVerified:
                  type: boolean
      subresources:
        status: {}
