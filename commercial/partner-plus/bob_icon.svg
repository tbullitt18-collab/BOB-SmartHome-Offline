<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- BOB Edge Systems - High Contrast Vector Icon for IBM watsonx Orchestrate Catalog -->
  <defs>
    <linearGradient id="bobGradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="100%" stop-color="#002d9c" />
    </linearGradient>
    <linearGradient id="bobGradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d6ff" />
      <stop offset="100%" stop-color="#0f62fe" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield Hexagon -->
  <polygon points="100,16 176,58 176,142 100,184 24,142 24,58" 
           fill="none" 
           stroke="url(#bobGradientPrimary)" 
           stroke-width="10" 
           stroke-linejoin="round" />

  <!-- Inner Concentric Circuit Path -->
  <polygon points="100,34 160,68 160,132 100,166 40,132 40,68" 
           fill="none" 
           stroke="url(#bobGradientAccent)" 
           stroke-width="4" 
           stroke-dasharray="8 6" 
           stroke-linejoin="round" 
           opacity="0.85" />

  <!-- Central Offline-First Core: Resilient Edge Node & Smart Home Roofline -->
  <path d="M100,52 L146,88 L134,88 L134,136 L66,136 L66,88 L54,88 Z" 
        fill="url(#bobGradientPrimary)" />

  <!-- Dynamic Energy / Resilience Lightning Bolt in Center Cutout -->
  <polygon points="104,70 82,102 98,102 92,126 120,94 104,94" 
           fill="#ffffff" />

  <!-- Edge Nodes / Local Bus Ports -->
  <circle cx="100" cy="16" r="8" fill="#00d6ff" />
  <circle cx="176" cy="58" r="8" fill="#00d6ff" />
  <circle cx="176" cy="142" r="8" fill="#00d6ff" />
  <circle cx="100" cy="184" r="8" fill="#00d6ff" />
  <circle cx="24" cy="142" r="8" fill="#00d6ff" />
  <circle cx="24" cy="58" r="8" fill="#00d6ff" />

  <!-- Offline Status Beacon -->
  <circle cx="100" cy="154" r="5" fill="#42be65" />
</svg>
