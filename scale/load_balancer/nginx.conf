user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# TCP load balancing for MQTT
stream {
    upstream mqtt_tcp {
        server emqx1:1883 max_fails=3 fail_timeout=30s;
        server emqx2:1883 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 1883;
        proxy_pass mqtt_tcp;
        proxy_connect_timeout 1s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream bob_api {
        server api-node1.bob.local:8080;
        server api-node2.bob.local:8080;
        server api-node3.bob.local:8080;
    }

    server {
        listen 80;
        server_name dashboard.bob.local;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://bob_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Caching configuration
            proxy_cache_valid 200 1m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        }

        location / {
            # Static dashboard content or frontend routing
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
    }
}
