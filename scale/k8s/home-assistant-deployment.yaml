apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: bob-system
  labels:
    app: home-assistant
spec:
  replicas: 3
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - home-assistant
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: home-assistant
        image: homeassistant/home-assistant:stable
        ports:
        - containerPort: 8123
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-service
  namespace: bob-system
spec:
  type: LoadBalancer
  ports:
  - port: 8123
    targetPort: 8123
    name: http
  selector:
    app: home-assistant
