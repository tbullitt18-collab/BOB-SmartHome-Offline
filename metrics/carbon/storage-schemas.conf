[carbon]
pattern = ^carbon\.
retentions = 60s:90d

[smart_home_devices]
pattern = ^smart_home\.devices\.
retentions = 10s:1d, 1m:7d, 5m:30d, 1h:2y

[smart_home_power]
pattern = ^smart_home\.power\.
retentions = 10s:7d, 1m:30d, 1h:2y

[smart_home_network]
pattern = ^smart_home\.network\.
retentions = 30s:7d, 5m:90d

[smart_home_sensors]
pattern = ^smart_home\.sensors\.
retentions = 30s:3d, 5m:30d, 1h:1y

[smart_home_battery]
pattern = ^smart_home\.battery\.
retentions = 1m:30d, 1h:2y

[default_1min_for_1day]
pattern = .*
retentions = 60s:1d
